<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ワクミラベース 閉店チェック（掲示用）</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Zen+Maru+Gothic:wght@700&display=swap">
<style>
@page { size: A4 portrait; margin: 14mm; }
* { box-sizing: border-box; }
html, body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body { margin: 0; font-family: "Zen Kaku Gothic New", "Noto Sans JP", sans-serif; color: #1f2a27; }
.page { display: grid; gap: 7mm; }
header { display: grid; gap: 2mm; padding-bottom: 5mm; border-bottom: 1.2mm solid #2f6f5e; }
.eyebrow { font-size: 11pt; letter-spacing: .15em; color: #66736f; }
h1 { font-family: "Zen Maru Gothic", sans-serif; font-size: 34pt; line-height: 1.25; margin: 0; }
.lead { font-size: 14pt; color: #3d4a46; }
section { display: grid; gap: 3.5mm; }
h2 { margin: 0; font-size: 14pt; letter-spacing: .1em; color: #66736f; }
.item {
  display: flex; align-items: center; gap: 6mm; padding: 4mm 6mm;
  border: 0.5mm solid #d9dfdb; border-radius: 4mm; background: #fff;
}
.box { flex: none; width: 11mm; height: 11mm; border: 0.7mm solid #9aa8a3; border-radius: 2.5mm; }
.text { display: grid; gap: 1mm; }
.text b { font-size: 21pt; line-height: 1.3; }
.text small { font-size: 13pt; color: #66736f; }
.key .item { border: 0.9mm solid #b5532a; }
.key .box { border-color: #b5532a; }
.key h2 { color: #b5532a; }
footer {
  margin-top: 0; padding: 5mm; border-radius: 4mm; background: #2f6f5e; color: #fff;
  font-family: "Zen Maru Gothic", sans-serif; font-size: 18pt; text-align: center;
}
</style>
</head>
<body>
<div class="page">
  <header>
    <span class="eyebrow">WAKUMIRA BASE ・ 帰る前に</span>
    <h1>閉店チェックリスト</h1>
    <span class="lead">上から順に、ひとつずつ確認してから帰ってください。</span>
  </header>

  <section>
    <h2>電源</h2>
    <div class="item"><span class="box"></span><span class="text"><b>空気清浄機の電源を切る</b><small>本体のランプが消えているか確認</small></span></div>
    <div class="item"><span class="box"></span><span class="text"><b>プリンターの電源を切る</b><small>電源ボタンのランプが消えているか確認</small></span></div>
    <div class="item"><span class="box"></span><span class="text"><b>エアコンを切る</b></span></div>
    <div class="item"><span class="box"></span><span class="text"><b>照明をすべて消す</b></span></div>
  </section>

  <section class="key">
    <h2>戸締まり（最後に）</h2>
    <div class="item"><span class="box"></span><span class="text"><b>窓を閉めて鍵をかける</b></span></div>
    <div class="item"><span class="box"></span><span class="text"><b>扉を閉めて鍵をかける</b><small>最後にドアノブを引いて、開かないことを確認</small></span></div>
  </section>

  <footer>全部OKなら、おつかれさまでした</footer>
</div>
</body>
</html>
