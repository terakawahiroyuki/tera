<title>ワクミラベース 閉店チェック</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Zen+Maru+Gothic:wght@700&display=swap">
<style>
/* Layout: one narrow column, big tap targets, grouped by where you stand in the room; door/lock always last */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --fg: #1f2a27;
  --muted: #66736f;
  --line: #d9dfdb;
  --accent: #2f6f5e;
  --accent-soft: #e2efe9;
  --done: #2f6f5e;
  --warn: #b5532a;
  --font-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141a18; --surface: #1c2421; --fg: #e6ece9; --muted: #95a39e; --line: #2d3834;
    --accent: #6cc0a5; --accent-soft: #20352e; --done: #6cc0a5; --warn: #e08a63; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141a18; --surface: #1c2421; --fg: #e6ece9; --muted: #95a39e; --line: #2d3834;
  --accent: #6cc0a5; --accent-soft: #20352e; --done: #6cc0a5; --warn: #e08a63; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 20px; }
header { display: grid; gap: 4px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); }
h1 { font-family: var(--font-display); font-size: 26px; line-height: 1.3; margin: 0; text-wrap: balance; }
.progress { display: grid; gap: 6px; }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
section { display: grid; gap: 8px; }
h2 { font-size: 13px; letter-spacing: .1em; color: var(--muted); margin: 0; font-weight: 700; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
label.item {
  display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 12px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
}
label.item input { position: absolute; opacity: 0; pointer-events: none; }
.box {
  flex: none; width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line);
  display: grid; place-items: center; transition: background .15s, border-color .15s;
}
.box svg { width: 16px; height: 16px; opacity: 0; }
.text { min-width: 0; display: grid; }
.text b { font-weight: 700; }
.text small { color: var(--muted); font-size: 13px; }
label.item:has(input:checked) { background: var(--accent-soft); border-color: transparent; }
label.item:has(input:checked) .box { background: var(--done); border-color: var(--done); }
label.item:has(input:checked) .box svg { opacity: 1; }
label.item:has(input:checked) .text b { text-decoration: line-through; color: var(--muted); }
label.item:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
.key label.item { border-color: var(--warn); border-width: 2px; }
.key label.item:has(input:checked) { border-color: transparent; }
.finish {
  padding: 18px; border-radius: 14px; background: var(--accent); color: var(--bg);
  font-family: var(--font-display); font-size: 18px; text-align: center;
}
.finish small { display: block; font-family: var(--font-body); font-size: 14px; opacity: .9; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
button {
  font: inherit; font-size: 14px; padding: 10px 16px; border-radius: 10px; cursor: pointer;
  background: var(--surface); color: var(--fg); border: 1px solid var(--line);
}
button:focus-visible, input[type=text]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
form.add { display: flex; gap: 8px; }
form.add input {
  flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
.del { margin-left: auto; flex: none; padding: 6px 10px; font-size: 12px; color: var(--warn); }
.note { font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">WAKUMIRA BASE ・ 帰る前に</span>
    <h1>閉店チェックリスト</h1>
    <span class="count" id="today"></span>
  </header>

  <div class="progress">
    <div class="bar"><i id="bar"></i></div>
    <span class="count" id="count"></span>
  </div>

  <div id="list"></div>

  <div class="finish" id="finish" hidden>全部OK。おつかれさまでした<small id="finishTime"></small></div>

  <div class="tools">
    <button type="button" id="reset">チェックを全部外す</button>
    <button type="button" id="editToggle">項目を編集</button>
  </div>

  <div id="editor" hidden>
    <form class="add" id="addForm">
      <input type="text" id="addText" placeholder="追加する項目（例：ゴミを出した）" aria-label="追加する項目">
      <button type="submit">追加</button>
    </form>
    <p class="note">追加した項目は「その他」に入ります。編集内容はこの端末にだけ保存されます。</p>
  </div>

  <p class="note">チェックは毎日0時にリセットされます。</p>
</div>

<script>
const check = '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3L13 4.5" stroke="var(--bg)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const DEFAULT = [
  { group: "電源", items: [
    { id: "purifier", t: "空気清浄機の電源を切った", s: "本体のランプが消えているか確認" },
    { id: "printer", t: "プリンターの電源を切った", s: "電源ボタンのランプが消えているか確認" },
    { id: "ac", t: "エアコンを切った" },
    { id: "light", t: "照明をすべて消した" }
  ]},
  { group: "戸締まり", key: true, items: [
    { id: "window", t: "窓を閉めて鍵をかけた" },
    { id: "door", t: "扉を閉めて鍵をかけた", s: "最後にドアノブを引いて開かないか確認" }
  ]}
];

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };

let extra = store.get("wb-extra", []);       // [{id, t}]
let hidden = store.get("wb-hidden", []);     // ids of default items removed
let state = store.get("wb-state", { day: "", done: {}, at: "" });
if (state.day !== todayKey()) state = { day: todayKey(), done: {}, at: "" };
let editing = false;

function groups() {
  const g = DEFAULT.map(x => ({ ...x, items: x.items.filter(i => !hidden.includes(i.id)) }));
  if (extra.length) g.splice(1, 0, { group: "その他", items: extra });  // keep 戸締まり last
  return g.filter(x => x.items.length);
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  list.style.display = "grid"; list.style.gap = "20px";
  let total = 0, done = 0;
  for (const g of groups()) {
    const sec = document.createElement("section");
    if (g.key) sec.className = "key";
    sec.innerHTML = `<h2>${g.group}</h2><ul></ul>`;
    const ul = sec.querySelector("ul");
    for (const it of g.items) {
      total++; if (state.done[it.id]) done++;
      const li = document.createElement("li");
      li.innerHTML = `<label class="item"><input type="checkbox" id="c-${it.id}"${state.done[it.id] ? " checked" : ""}>
        <span class="box">${check}</span>
        <span class="text"><b></b>${it.s ? "<small></small>" : ""}</span>
        ${editing ? '<button type="button" class="del">削除</button>' : ""}</label>`;
      li.querySelector("b").textContent = it.t;
      if (it.s) li.querySelector("small").textContent = it.s;
      li.querySelector("input").addEventListener("change", e => {
        state.done[it.id] = e.target.checked;
        const all = groups().every(x => x.items.every(i => state.done[i.id]));
        state.at = all ? new Date().toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" }) : "";
        store.set("wb-state", state); render();
      });
      const del = li.querySelector(".del");
      if (del) del.addEventListener("click", e => {
        e.preventDefault();
        if (extra.some(x => x.id === it.id)) { extra = extra.filter(x => x.id !== it.id); store.set("wb-extra", extra); }
        else { hidden.push(it.id); store.set("wb-hidden", hidden); }
        delete state.done[it.id]; store.set("wb-state", state); render();
      });
      ul.appendChild(li);
    }
    list.appendChild(sec);
  }
  document.getElementById("bar").style.width = total ? `${done / total * 100}%` : "0";
  document.getElementById("count").textContent = `${done} / ${total} 完了`;
  const fin = document.getElementById("finish");
  fin.hidden = !(total && done === total);
  document.getElementById("finishTime").textContent = state.at ? `${state.at} にチェック完了` : "";
}

const d = new Date();
document.getElementById("today").textContent =
  `${d.getMonth() + 1}/${d.getDate()}(${"日月火水木金土"[d.getDay()]})`;

document.getElementById("reset").addEventListener("click", () => {
  state = { day: todayKey(), done: {}, at: "" }; store.set("wb-state", state); render();
});
document.getElementById("editToggle").addEventListener("click", e => {
  editing = !editing;
  document.getElementById("editor").hidden = !editing;
  e.target.textContent = editing ? "編集を終える" : "項目を編集";
  render();
});
document.getElementById("addForm").addEventListener("submit", e => {
  e.preventDefault();
  const input = document.getElementById("addText");
  const t = input.value.trim(); if (!t) return;
  extra.push({ id: "x" + Date.now(), t }); store.set("wb-extra", extra);
  input.value = ""; render();
});

render();
</script>
